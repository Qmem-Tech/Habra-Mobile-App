name: habra_mobile_app
description: "A Flutter super app with Clean Architecture, Firebase, Theme Management, and Localization"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Dependency Injection
  get_it: ^7.6.4

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6
  firebase_messaging: ^14.7.10
  firebase_analytics: ^10.7.4
  firebase_crashlytics: ^3.4.9
  firebase_remote_config: ^4.3.10

  # Networking
  dio: ^5.4.0
  json_annotation: ^4.8.1

  # Code Generation
  json_serializable: ^6.7.1

  # Local Storage
  shared_preferences: ^2.2.2

  # Routing
  go_router: ^12.1.3

  # Utilities
  logger: ^2.0.2+1
  connectivity_plus: ^5.0.2
  package_info_plus: ^5.0.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.7
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # Localization configuration
  generate: true

  # Assets configuration
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/icons/
    - assets/logos/

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/habra_app_lcon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
