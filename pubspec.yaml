name: habra_mobile_app
description: "A Flutter super app with Clean Architecture, Supabase backend, Theme Management, and Localization"
publish_to: 'none'

version: 1.0.1+7

environment:
  sdk: '^3.8.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Dependency Injection
  get_it: ^7.6.4

  # Google Sign-In (used by Supabase for OAuth)
  google_sign_in: ^6.1.6

  # Networking
  dio: ^5.4.0
  json_annotation: ^4.9.0
  supabase_flutter: ^2.8.0

  # Local Storage
  shared_preferences: ^2.2.2

  # Routing
  go_router: ^12.1.3

  # Utilities
  crypto: ^3.0.6
  logger: ^2.0.2+1
  connectivity_plus: ^5.0.2
  package_info_plus: ^9.0.0
  intl: ^0.20.2
  flutter_svg: ^2.0.17
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.0

  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^11.0.0
  geocoding: ^2.1.1
  url_launcher: ^6.2.0
  share_plus: ^10.1.4
  pdf: ^3.11.1
  path_provider: ^2.1.5
  open_mail_launcher: ^0.1.2

  # Photos & Files
  image_picker: ^1.0.7
  file_picker: ^10.0.0 # 8.x+ fixes linux/macos/windows plugin warnings

  # Payments: RevenueCat (subscriptions / IAP), Stripe (event tickets via PaymentSheet)
  purchases_flutter: ^8.0.0
  flutter_stripe: ^11.4.0

  # SSO
  sign_in_with_apple: ^6.1.4

  # Phone & Country Code
  intl_phone_field: ^3.1.0

  # Permissions
  permission_handler: ^11.3.0

  # Push (FCM) — see docs/PUSH_NOTIFICATIONS_SETUP.md
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  app_links: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # Localization configuration
  generate: true

  # Assets configuration
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/home/
    - assets/icons/
    - assets/logos/
    - assets/illustration/

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/habra_app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
