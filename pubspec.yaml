name: habra_mobile_app
description: "A Flutter super app with Clean Architecture, Firebase, Theme Management, and Localization"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.8.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  dartz: ^0.10.1

  # Dependency Injection
  get_it: ^7.6.4

  # Firebase (FlutterFire BoM 4.8.0 – iOS SDK 12.8, compatible with google_sign_in)
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  firebase_messaging: ^16.1.1
  firebase_analytics: ^12.1.1
  firebase_crashlytics: ^5.0.7
  firebase_remote_config: ^6.1.4
  google_sign_in: ^6.1.6

  # Networking
  dio: ^5.4.0
  json_annotation: ^4.9.0

  # Local Storage
  shared_preferences: ^2.2.2

  # Routing
  go_router: ^12.1.3

  # Utilities
  logger: ^2.0.2+1
  connectivity_plus: ^5.0.2
  package_info_plus: ^9.0.0
  intl: ^0.20.2
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  # Localization configuration
  generate: true

  # Assets configuration
  assets:
    - assets/images/
    - assets/images/onboarding/
    - assets/images/home/
    - assets/images/events/
    - assets/images/deals/
    - assets/images/businesses/
    - assets/images/jobs/
    - assets/icons/
    - assets/logos/

# Flutter Launcher Icons configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/habra_app_lcon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
